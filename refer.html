<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NOVE - Referral</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    :root {
      --red: #ff1744;
      --red-dark: #c4002f;
      --red-light: #ff4d6d;

      --black: #040406;
      --black-2: #0a0a0e;
      --card: #111116;
      --card-2: #15151b;

      --white: #ffffff;
      --muted: #9696a3;

      --border:
        rgba(255,255,255,0.08);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      color: var(--white);

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(255,23,68,0.17),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 25%,
          rgba(196,0,47,0.10),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #030305,
          #09090d 45%,
          #030305
        );

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        );

      background-size: 42px 42px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 90%
        );
    }

    /* =================================
       CONTAINER
    ================================= */

    .container {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 680px;

      margin: auto;

      padding:
        18px
        14px
        55px;
    }

    /* =================================
       HEADER
    ================================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 20;

      display: flex;
      align-items: center;
      gap: 13px;

      margin:
        -18px
        -14px
        22px;

      padding:
        12px
        14px;

      min-height: 68px;

      background:
        rgba(4,4,6,0.84);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid var(--border);

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.35);
    }

    .back {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      text-decoration: none;

      border-radius: 13px;

      background:
        rgba(255,255,255,0.045);

      border:
        1px solid var(--border);

      font-size: 25px;

      transition:
        .2s ease;
    }

    .back:hover {
      transform: translateX(-2px);

      background:
        rgba(255,23,68,0.10);

      border-color:
        rgba(255,23,68,0.35);
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .header-title h1 span {
      color: var(--red);
    }

    .header-subtitle {
      margin-top: 3px;

      color: var(--muted);

      font-size: 9px;

      text-transform: uppercase;

      letter-spacing: 1.3px;
    }

    .header-space {
      width: 42px;
    }

    /* =================================
       CARD
    ================================= */

    .card {
      position: relative;
      overflow: hidden;

      padding: 20px;

      margin-bottom: 17px;

      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(20,20,26,0.97),
          rgba(9,9,13,0.97)
        );

      border:
        1px solid var(--border);

      box-shadow:
        0 17px 45px
        rgba(0,0,0,0.30);

      animation:
        cardIn .55s ease both;
    }

    .card::before {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      right: -75px;
      top: -75px;

      border-radius: 50%;

      background:
        rgba(255,23,68,0.08);

      pointer-events: none;
    }

    .card:nth-child(2) {
      animation-delay: .08s;
    }

    .card:nth-child(3) {
      animation-delay: .14s;
    }

    .card:nth-child(4) {
      animation-delay: .20s;
    }

    /* =================================
       CARD TITLE
    ================================= */

    .title-row {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 15px;
    }

    .title-icon {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          rgba(255,23,68,0.18),
          rgba(255,23,68,0.04)
        );

      border:
        1px solid
        rgba(255,23,68,0.22);

      font-size: 19px;

      box-shadow:
        0 0 22px
        rgba(255,23,68,0.06);
    }

    .title {
      font-size: 17px;
      font-weight: 900;
    }

    .subtitle {
      color: var(--muted);

      font-size: 11px;

      line-height: 1.6;
    }

    /* =================================
       REFERRAL CODE
    ================================= */

    .code-box {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 12px;

      border-radius: 15px;

      background:
        #09090d;

      border:
        1px solid
        rgba(255,255,255,0.08);
    }

    .code {
      min-width: 0;

      color: var(--red-light);

      font-size: 18px;
      font-weight: 900;

      letter-spacing: 1.3px;

      word-break: break-all;

      text-shadow:
        0 0 18px
        rgba(255,23,68,0.20);
    }

    .copy-btn {
      position: relative;

      flex-shrink: 0;

      border: none;

      border-radius: 10px;

      padding:
        10px
        14px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--red-dark)
        );

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;

      transition:
        .2s ease;

      box-shadow:
        0 7px 18px
        rgba(255,23,68,0.18);
    }

    .copy-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 23px
        rgba(255,23,68,0.28);
    }

    .copy-btn:active {
      transform: translateY(0);
    }

    /* =================================
       LINK
    ================================= */

    .link-box {
      padding: 13px;

      margin-bottom: 11px;

      border-radius: 13px;

      color: #a8a8b4;

      background:
        #09090d;

      border:
        1px solid
        rgba(255,255,255,0.07);

      font-size: 12px;

      line-height: 1.6;

      word-break: break-all;
    }

    .share-btn {
      position: relative;

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 13px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--red-dark)
        );

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;

      overflow: hidden;

      box-shadow:
        0 10px 25px
        rgba(255,23,68,0.20);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .share-btn::before {
      content: "";

      position: absolute;

      left: -120%;
      top: 0;

      width: 80%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.20),
          transparent
        );

      transform: skewX(-20deg);

      transition:
        left .65s ease;
    }

    .share-btn:hover::before {
      left: 140%;
    }

    .share-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 14px 30px
        rgba(255,23,68,0.30);
    }

    /* =================================
       MESSAGE
    ================================= */

    .message {
      min-height: 18px;

      margin-top: 9px;

      text-align: center;

      font-size: 11px;

      font-weight: 700;
    }

    .message.success {
      color: #61e6a0;
    }

    .message.error {
      color: #ff7189;
    }

    /* =================================
       STATS
    ================================= */

    .stats {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    .stat {
      position: relative;
      overflow: hidden;

      padding: 20px 12px;

      text-align: center;

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.045),
          rgba(255,255,255,0.015)
        );

      border:
        1px solid
        rgba(255,255,255,0.07);

      transition:
        transform .2s ease,
        border-color .2s ease;
    }

    .stat:hover {
      transform: translateY(-3px);

      border-color:
        rgba(255,23,68,0.25);
    }

    .stat::before {
      content: "";

      position: absolute;

      width: 70px;
      height: 70px;

      top: -45px;
      right: -35px;

      border-radius: 50%;

      background:
        rgba(255,23,68,0.10);
    }

    .stat-number {
      position: relative;

      color: var(--red);

      font-size: 27px;
      font-weight: 900;

      margin-bottom: 6px;

      text-shadow:
        0 0 20px
        rgba(255,23,68,0.22);
    }

    .stat-label {
      color: #888894;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .5px;
    }

    /* =================================
       MEMBERS
    ================================= */

    .member {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 14px 2px;

      border-bottom:
        1px solid
        rgba(255,255,255,0.06);

      animation:
        memberIn .35s ease both;
    }

    .member:last-child {
      border-bottom: none;
    }

    .member-avatar {
      width: 39px;
      height: 39px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(255,23,68,0.20),
          rgba(255,23,68,0.06)
        );

      border:
        1px solid
        rgba(255,23,68,0.18);

      font-size: 15px;
      font-weight: 900;
    }

    .member-info {
      min-width: 0;
      flex: 1;
    }

    .member-name {
      margin-bottom: 4px;

      color: #eeeeF3;

      font-size: 13px;
      font-weight: 800;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .member-mobile {
      color: #777783;

      font-size: 11px;
    }

    /* =================================
       EMPTY / LOADING / ERROR
    ================================= */

    .empty,
    .loading {
      padding: 30px 10px;

      text-align: center;

      color: #73737f;

      font-size: 12px;

      line-height: 1.6;
    }

    .loading::before {
      content: "";

      display: block;

      width: 24px;
      height: 24px;

      margin:
        0 auto
        10px;

      border:
        2px solid
        rgba(255,255,255,0.08);

      border-top-color:
        var(--red);

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    .empty-icon {
      display: block;

      margin-bottom: 8px;

      color: #44444e;

      font-size: 30px;
    }

    .error {
      padding: 15px;

      border-radius: 14px;

      color: #ff7189;

      background:
        rgba(255,23,68,0.07);

      border:
        1px solid
        rgba(255,23,68,0.20);

      text-align: center;

      font-size: 12px;
      font-weight: 700;

      line-height: 1.5;
    }

    /* =================================
       ANIMATIONS
    ================================= */

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes memberIn {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 480px) {

      .container {
        padding:
          15px
          11px
          45px;
      }

      .header {
        margin:
          -15px
          -11px
          18px;

        padding:
          10px
          12px;
      }

      .header-title h1 {
        font-size: 17px;
      }

      .card {
        padding: 17px;

        border-radius: 19px;
      }

      .code {
        font-size: 16px;
      }

      .copy-btn {
        padding:
          9px
          11px;
      }
    }

    @media (max-width: 360px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .code-box {
        align-items: stretch;

        flex-direction: column;
      }

      .copy-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

      <a
        href="home.html"
        class="back"
        aria-label="Back">
        ‹
      </a>

      <div class="header-title">

        <h1>
          NOVE <span>Referral</span>
        </h1>

        <div class="header-subtitle">
          Invite & manage referrals
        </div>

      </div>

      <div class="header-space"></div>

    </div>


    <!-- =========================
         REFERRAL AREA
    ========================= -->

    <div id="referralArea">

      <div class="loading">
        Loading referral information...
      </div>

    </div>


    <!-- =========================
         STATS
    ========================= -->

    <div class="card">

      <div class="title-row">

        <div class="title-icon">
          📊
        </div>

        <div>

          <div class="title">
            Referral Overview
          </div>

          <div class="subtitle">
            Track your referral activity
          </div>

        </div>

      </div>


      <div class="stats">

        <div class="stat">

          <div
            id="totalReferrals"
            class="stat-number">
            0
          </div>

          <div class="stat-label">
            Total Referrals
          </div>

        </div>


        <div class="stat">

          <div
            id="activeReferrals"
            class="stat-number">
            0
          </div>

          <div class="stat-label">
            Active Referrals
          </div>

        </div>

      </div>

    </div>


    <!-- =========================
         REFERRED USERS
    ========================= -->

    <div class="card">

      <div class="title-row">

        <div class="title-icon">
          👥
        </div>

        <div>

          <div class="title">
            My Referrals
          </div>

          <div class="subtitle">
            People registered using your referral
          </div>

        </div>

      </div>


      <div id="membersArea">

        <div class="loading">
          Loading...
        </div>

      </div>

    </div>

  </div>


  <script>

    let currentReferralCode = "";


    /* =========================
       LOAD REFERRAL DATA
    ========================= */

    async function loadReferral() {

      const referralArea =
        document.getElementById(
          "referralArea"
        );

      const membersArea =
        document.getElementById(
          "membersArea"
        );


      try {

        const meResponse =
          await fetch(
            "/api/me",
            {
              credentials: "include",
              cache: "no-store"
            }
          );


        if (
          meResponse.status === 401
        ) {

          window.location.href =
            "login.html";

          return;

        }


        if (!meResponse.ok) {

          throw new Error(
            "Unable to load account."
          );

        }


        const meData =
          await meResponse.json();


        const user =
          meData.user ||
          meData;


        const referralCode =
          user.referral_code ||
          user.referralCode ||
          "";


        currentReferralCode =
          referralCode;


        if (!referralCode) {

          referralArea.innerHTML = `
            <div class="error">
              Referral code is not available.
            </div>
          `;

        } else {

          const referralLink =
            window.location.origin +
            "/register.html?ref=" +
            encodeURIComponent(
              referralCode
            );


          referralArea.innerHTML = `

            <!-- REFERRAL CODE -->

            <div class="card">

              <div class="title-row">

                <div class="title-icon">
                  🎁
                </div>

                <div>

                  <div class="title">
                    Your Referral Code
                  </div>

                  <div class="subtitle">
                    Share your code with friends
                    to invite them.
                  </div>

                </div>

              </div>


              <div class="code-box">

                <div class="code">
                  ${escapeHtml(
                    referralCode
                  )}
                </div>

                <button
                  type="button"
                  class="copy-btn"
                  onclick="copyCode()">
                  Copy
                </button>

              </div>


              <div
                id="copyMessage"
                class="message">
              </div>

            </div>


            <!-- REFERRAL LINK -->

            <div class="card">

              <div class="title-row">

                <div class="title-icon">
                  🔗
                </div>

                <div>

                  <div class="title">
                    Referral Link
                  </div>

                  <div class="subtitle">
                    Share this link directly.
                  </div>

                </div>

              </div>


              <div class="link-box">
                ${escapeHtml(
                  referralLink
                )}
              </div>


              <button
                type="button"
                class="share-btn"
                onclick="shareReferral()">

                🚀 Share Referral Link

              </button>


              <div
                id="shareMessage"
                class="message">
              </div>

            </div>

          `;

        }


        await loadReferralUsers();


      } catch (error) {

        console.error(
          "Referral error:",
          error
        );


        referralArea.innerHTML = `
          <div class="error">
            Unable to load referral information.
          </div>
        `;


        membersArea.innerHTML = `
          <div class="error">
            Unable to load referrals.
          </div>
        `;

      }

    }


    /* =========================
       LOAD REFERRAL USERS
    ========================= */

    async function loadReferralUsers() {

      const membersArea =
        document.getElementById(
          "membersArea"
        );


      try {

        const response =
          await fetch(
            "/api/referrals",
            {
              credentials: "include",
              cache: "no-store"
            }
          );


        if (
          response.status === 404
        ) {

          showEmptyReferrals(
            "No referral data available yet."
          );

          return;

        }


        if (
          response.status === 401
        ) {

          window.location.href =
            "login.html";

          return;

        }


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Unable to load referrals."
          );

        }


        const users =
          Array.isArray(data)
            ? data
            : (
                data.referrals ||
                data.users ||
                []
              );


        updateStats(users);


        if (
          users.length === 0
        ) {

          showEmptyReferrals(
            "No referrals yet. Share your referral link to invite users."
          );

          return;

        }


        membersArea.innerHTML =
          "";


        users.forEach(
          (user, index) => {

            const name =
              user.name ||
              user.full_name ||
              "User";


            const mobile =
              user.mobile ||
              user.phone ||
              user.phone_number ||
              "-";


            const member =
              document.createElement(
                "div"
              );


            member.className =
              "member";


            member.style.animationDelay =
              `${index * 0.05}s`;


            const firstLetter =
              String(name)
                .charAt(0)
                .toUpperCase();


            member.innerHTML = `

              <div class="member-avatar">
                ${escapeHtml(
                  firstLetter
                )}
              </div>

              <div class="member-info">

                <div class="member-name">
                  ${escapeHtml(name)}
                </div>

                <div class="member-mobile">
                  ${escapeHtml(mobile)}
                </div>

              </div>

            `;


            membersArea.appendChild(
              member
            );

          }
        );


      } catch (error) {

        console.error(
          "Referral users error:",
          error
        );


        showEmptyReferrals(
          "No referral data available yet."
        );

      }

    }


    /* =========================
       STATS
    ========================= */

    function updateStats(users) {

      const total =
        users.length;


      const active =
        users.filter(
          user => {

            const status =
              String(
                user.status || ""
              ).toLowerCase();


            return (
              status === "active" ||
              status === "approved"
            );

          }
        ).length;


      document.getElementById(
        "totalReferrals"
      ).textContent =
        total;


      document.getElementById(
        "activeReferrals"
      ).textContent =
        active;

    }


    /* =========================
       EMPTY
    ========================= */

    function showEmptyReferrals(
      message
    ) {

      document.getElementById(
        "membersArea"
      ).innerHTML = `

        <div class="empty">

          <span class="empty-icon">
            👥
          </span>

          ${escapeHtml(message)}

        </div>

      `;

    }


    /* =========================
       COPY CODE
    ========================= */

    async function copyCode() {

      const message =
        document.getElementById(
          "copyMessage"
        );


      if (!currentReferralCode) {

        message.className =
          "message error";

        message.textContent =
          "Referral code unavailable.";

        return;

      }


      try {

        await navigator.clipboard.writeText(
          currentReferralCode
        );


        message.className =
          "message success";

        message.textContent =
          "✓ Referral code copied.";


      } catch (error) {

        message.className =
          "message error";

        message.textContent =
          "Unable to copy code.";

      }

    }


    /* =========================
       SHARE LINK
    ========================= */

    async function shareReferral() {

      const shareMessage =
        document.getElementById(
          "shareMessage"
        );


      const link =
        window.location.origin +
        "/register.html?ref=" +
        encodeURIComponent(
          currentReferralCode
        );


      if (
        navigator.share
      ) {

        try {

          await navigator.share({

            title:
              "NOVE Referral",

            text:
              "Join NOVE using my referral link.",

            url:
              link

          });

        } catch (error) {

          // User cancelled sharing.

        }

        return;

      }


      try {

        await navigator.clipboard.writeText(
          link
        );


        shareMessage.className =
          "message success";

        shareMessage.textContent =
          "✓ Referral link copied.";


      } catch (error) {

        shareMessage.className =
          "message error";

        shareMessage.textContent =
          "Unable to copy referral link.";

      }

    }


    /* =========================
       HTML ESCAPE
    ========================= */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================
       START
    ========================= */

    loadReferral();

  </script>
